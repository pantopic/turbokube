syntax = "proto3";

package etcdserverpb;

option go_package = "github.com/pantopic/turbokube/internal";

import "api.proto";

message LeaseExpireRequest {}
message LeaseExpireResponse {
  uint64 epoch = 1;
  repeated uint64 expired = 2;
}

message TickRequest {
  uint64 term = 1;
  uint64 lease_epoch = 2;
  repeated uint64 leases_expired = 3;
}
message TickResponse {
  uint64 epoch = 1;
  repeated uint64 lease_ids = 2;
  repeated uint64 lease_ttls = 3;
}

message LeaseTickRequest {
  uint64 epoch = 1;
  repeated uint64 ids = 2;
  repeated uint64 ttl = 3;
}
message LeaseTickResponse {}

message TermRequest {
  uint64 term = 1;
}
message TermResponse {
}

message LeaseKeepAliveBatchRequest {
  repeated int64 IDs = 1;
}
message LeaseKeepAliveBatchResponse {
  ResponseHeader header = 1;
  repeated int64 TTLs = 2;
}

message WatchEventBatch {
  Event event = 1;
  uint64 revision = 2;
  repeated int64 watch_ids = 3;
  repeated int64 watch_ids_prev = 4;
}

message WatchEventSync {
  repeated int64 IDs = 1;
  uint64 revision = 2;
}
